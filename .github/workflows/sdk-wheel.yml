name: SDK wheel

on:
  pull_request:
    paths: ["packages/sdk/**", ".github/workflows/sdk-wheel.yml"]
  push:
    branches: ["**"]
    paths: ["packages/sdk/**", ".github/workflows/sdk-wheel.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit to build
        type: string
        default: ""

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv
      - name: Build native wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/sdk
          command: build
          args: --release --locked --interpreter python${{ matrix.python }} --out ../../dist
          manylinux: "2_28"
          rust-toolchain: "1.89.0"
      - name: Install and smoke-test the wheel in isolation
        run: |
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/sdk-smoke"
          uv pip install --python "$RUNNER_TEMP/sdk-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/sdk-smoke/bin/python" -I packages/sdk/tests/smoke_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: python -m pip install uv
      - name: Build sdist and rebuild wheel from its isolated contents
        run: uv build packages/sdk --python 3.12 --out-dir dist
      - name: Install and smoke-test rebuilt wheel
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/sdk-smoke"
          uv pip install --python "$RUNNER_TEMP/sdk-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/sdk-smoke/bin/python" -I packages/sdk/tests/smoke_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-source
          path: dist/*.tar.gz
          if-no-files-found: error
