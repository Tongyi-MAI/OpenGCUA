name: Release downloads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      app-version: ${{ steps.metadata.outputs.app_version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Validate requested tag syntax
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Use a tag such as v0.1.0 or v0.2.0rc1 matching packages/sdk/pyproject.toml" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test release validation
        run: python .github/tests/test_release_assets.py
      - name: Resolve version and immutable source commit
        id: metadata
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python .github/scripts/release_assets.py metadata \
            --tag "$RELEASE_TAG" --sha "$(git rev-parse HEAD)" \
            --github-output "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    uses: ./.github/workflows/macos-app.yml
    with:
      source-ref: ${{ needs.prepare.outputs.sha }}
      app-version: ${{ needs.prepare.outputs.app-version }}
      build-number: ${{ format('{0}', github.run_number) }}

  sdk:
    needs: prepare
    uses: ./.github/workflows/sdk-wheel.yml
    with:
      source-ref: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, macos, sdk]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate all downloads and write release checksums
        run: |
          python .github/scripts/release_assets.py assets \
            --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
      - name: Publish complete downloads to GitHub Releases
        run: |
          remote_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "The release tag moved during the build; refusing to publish mismatched assets" >&2
            exit 1
          fi
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" == false ]]; then
            echo "This release is already published; use a new version tag" >&2
            exit 1
          fi
          if [[ "$draft" != true ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --prerelease="$PRERELEASE" --title "OpenGCUA $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
