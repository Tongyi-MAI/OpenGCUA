name: Native macOS app

on:
  pull_request:
    paths: ["packages/macos/**", "packages/harness/runtime/**", "packages/sdk/**", ".github/workflows/macos-app.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit to build
        type: string
        default: ""
      app-version:
        description: Numeric macOS app version for a release
        type: string
        default: ""
      build-number:
        description: macOS bundle build number
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Build standalone Apple Silicon app
        env:
          APP_VERSION: ${{ inputs.app-version }}
          BUILD_NUMBER: ${{ inputs.build-number || '1' }}
        run: |
          args=(--identity - --build-number "$BUILD_NUMBER")
          if [[ -n "$APP_VERSION" ]]; then args+=(--app-version "$APP_VERSION"); fi
          uv run --no-project --python 3.12 python packages/macos/scripts/build.py "${args[@]}"
      - name: Test signing identity selection
        run: python3 packages/macos/tests/test_signing.py
      - name: Test background login-state helper patch
        run: python3 packages/macos/tests/test_browser_storage_patch.py
      - name: Test native task lifecycle and SDK integration
        run: |
          sdk_wheel="$(python3 -c 'from pathlib import Path; wheels = list(Path("packages/macos/build/wheels").glob("qwen_intelligence_sdk-*-cp312-*-macosx*.whl")); assert len(wheels) == 1, wheels; print(wheels[0].resolve())')"
          uv run --no-project --python 3.12 --with ./packages/harness/runtime --with "$sdk_wheel" --with pytest pytest packages/harness/runtime/tests/test_native_host.py packages/harness/runtime/tests/test_native_session_controls.py packages/harness/runtime/tests/test_sdk_runtime.py packages/harness/runtime/tests/test_web_shim_lifecycle.py packages/harness/runtime/tests/test_overlay_guard.py packages/harness/runtime/tests/test_image_store.py -q
      - name: Test unified events, bounded reconnect and durable action journal
        run: |
          sdk_wheel="$(python3 -c 'from pathlib import Path; wheels = list(Path("packages/macos/build/wheels").glob("qwen_intelligence_sdk-*-cp312-*-macosx*.whl")); assert len(wheels) == 1, wheels; print(wheels[0].resolve())')"
          uv run --no-project --python 3.12 --with ./packages/harness/runtime --with "$sdk_wheel" --with pytest pytest \
            packages/harness/runtime/tests/test_event_replay.py \
            packages/harness/runtime/tests/test_event_stream.py \
            packages/harness/runtime/tests/test_action_journal.py \
            packages/harness/runtime/tests/test_action_journal_executor.py \
            packages/harness/runtime/tests/test_action_feedback.py \
            packages/harness/runtime/tests/test_action_feedback_precheck.py \
            packages/harness/runtime/tests/test_journal_agent_integration.py -q -p no:cacheprovider
      - name: Test long-term memory review, recall and native wire
        run: |
          sdk_wheel="$(python3 -c 'from pathlib import Path; wheels = list(Path("packages/macos/build/wheels").glob("qwen_intelligence_sdk-*-cp312-*-macosx*.whl")); assert len(wheels) == 1, wheels; print(wheels[0].resolve())')"
          uv run --no-project --python 3.12 --with ./packages/harness/runtime --with "$sdk_wheel" --with pytest pytest \
            packages/harness/runtime/tests/test_memory_store.py \
            packages/harness/runtime/tests/test_memory_channel.py \
            packages/harness/runtime/tests/test_memory_native.py \
            packages/harness/runtime/tests/test_memory_agent.py \
            packages/harness/runtime/tests/test_context_metrics.py \
            packages/harness/runtime/tests/test_context_risk.py \
            packages/harness/runtime/tests/test_context_status.py \
            packages/harness/runtime/tests/test_tui_pty.py \
            packages/harness/runtime/tests/test_sdk_ax_metadata.py \
            packages/harness/runtime/tests/test_dingtalk_skill_contract.py -q -p no:cacheprovider
      - name: Test localization and system language defaults
        run: |
          python3 packages/macos/tests/test_localization.py
          swiftc -swift-version 5 -target arm64-apple-macosx14.0 packages/macos/Sources/Localization.swift packages/macos/Sources/VoiceTaskTools.swift packages/macos/Sources/Settings.swift packages/macos/tests/LocalizationContracts.swift -o packages/macos/build/generalist-localization-contracts
          packages/macos/build/generalist-localization-contracts packages/macos/Resources
      - name: Test voice transcript and settings contracts
        run: |
          swiftc -swift-version 5 -target arm64-apple-macosx14.0 packages/macos/Sources/Localization.swift packages/macos/Sources/AudioInputDevices.swift packages/macos/Sources/VoiceTaskTools.swift packages/macos/Sources/Settings.swift packages/macos/Sources/RealtimeTranscript.swift packages/macos/tests/VoiceContracts.swift -o packages/macos/build/generalist-voice-contracts
          packages/macos/build/generalist-voice-contracts
      - name: Test voice task routing
        run: |
          swiftc -swift-version 5 -target arm64-apple-macosx14.0 packages/macos/Sources/Localization.swift packages/macos/Sources/AudioInputDevices.swift packages/macos/Sources/VoiceTaskTools.swift packages/macos/Sources/Settings.swift packages/macos/Sources/SpeechInput.swift packages/macos/Sources/QwenSpeechInput.swift packages/macos/Sources/AppModel.swift packages/macos/Sources/SessionControls.swift packages/macos/tests/VoiceRouterContracts.swift -o packages/macos/build/generalist-voice-router-contracts
          packages/macos/build/generalist-voice-router-contracts
      - name: Test long-term memory native review contracts
        run: |
          swiftc -swift-version 5 -target arm64-apple-macosx14.0 packages/macos/Sources/Localization.swift packages/macos/Sources/AudioInputDevices.swift packages/macos/Sources/VoiceTaskTools.swift packages/macos/Sources/Settings.swift packages/macos/Sources/SpeechInput.swift packages/macos/Sources/QwenSpeechInput.swift packages/macos/Sources/AppModel.swift packages/macos/Sources/SessionControls.swift packages/macos/tests/MemoryContracts.swift -o packages/macos/build/generalist-memory-contracts
          packages/macos/build/generalist-memory-contracts
      - name: Test configuration file reload and credential isolation
        run: |
          swiftc -swift-version 5 -target arm64-apple-macosx14.0 packages/macos/Sources/Localization.swift packages/macos/Sources/VoiceTaskTools.swift packages/macos/Sources/Settings.swift packages/macos/Sources/FirstLaunch.swift packages/macos/tests/ConfigContracts.swift -o packages/macos/build/generalist-config-contracts
          packages/macos/build/generalist-config-contracts
      - name: Test task input shortcuts and input method safety
        run: |
          swiftc -swift-version 5 -target arm64-apple-macosx14.0 packages/macos/Sources/Localization.swift packages/macos/Sources/TaskInputShortcut.swift packages/macos/tests/TaskInputContracts.swift -o packages/macos/build/generalist-task-input-contracts
          packages/macos/build/generalist-task-input-contracts
      - name: Test settings draft and credential destinations
        run: |
          swiftc -swift-version 5 -target arm64-apple-macosx14.0 packages/macos/Sources/Localization.swift packages/macos/Sources/VoiceTaskTools.swift packages/macos/Sources/Settings.swift packages/macos/Sources/SettingsEditor.swift packages/macos/tests/SettingsEditorContracts.swift -o packages/macos/build/generalist-settings-editor-contracts
          packages/macos/build/generalist-settings-editor-contracts
      - name: Test menu popover desktop transitions
        run: |
          swiftc -swift-version 5 -target arm64-apple-macosx14.0 packages/macos/Sources/Localization.swift packages/macos/Sources/MenuPopoverBehavior.swift packages/macos/Sources/MainWindow.swift packages/macos/tests/PopoverContracts.swift -o packages/macos/build/generalist-popover-contracts
          packages/macos/build/generalist-popover-contracts
      - name: Test mini window dragging and automation visibility
        run: |
          swiftc -swift-version 5 -target arm64-apple-macosx14.0 packages/macos/Sources/Localization.swift packages/macos/Sources/MiniWindow.swift packages/macos/tests/MiniWindowContracts.swift -o packages/macos/build/generalist-mini-window-contracts
          packages/macos/build/generalist-mini-window-contracts
          swiftc -parse-as-library -swift-version 5 -target arm64-apple-macosx14.0 packages/macos/Sources/Localization.swift packages/macos/Sources/MiniWindow.swift packages/macos/Sources/TaskOrbView.swift packages/macos/tests/MiniWindowLayoutContracts.swift -o packages/macos/build/generalist-mini-window-layout-contracts
          packages/macos/build/generalist-mini-window-layout-contracts
      - name: Verify relocated runtime without a web server
        run: uv run --no-project --python 3.12 python packages/macos/tests/test_bundle.py
      - name: Archive local development build
        run: bash packages/macos/scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGCUA-macOS-arm64-development
          path: |
            packages/macos/build/OpenGCUA-macOS-arm64.dmg
            packages/macos/build/OpenGCUA-macOS-arm64.dmg.sha256
          if-no-files-found: error
