[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mai-ui-macos-agent"
version = "0.1.0"
description = "Persistent code-execution Agent and recording studio for mai-ui macOS"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "json-repair>=0.30",
  "Pillow>=11",
  "pyautogui>=0.9.54",
  "playwright>=1.48",
  "prompt-toolkit>=3.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "rich>=13.9",
]

[project.scripts]
mai-ui-macos-agent = "mac_agent:main"
mai-ui-gui-agent = "gui_agent:main"
mai-ui-macos-demo-hub = "demo_hub:main"

[tool.setuptools]
packages = ["mobile"]
include-package-data = false
py-modules = [
  "mac_agent",
  "gui_agent",
  "llm_entry",
  "model_stream",
  "model_metrics",
  "llm_compaction",
  "rollout_data",
  "code_executor",
  "code_runtime",
  "agent_events",
  "console_protocol",
  "sdk_backend",
  "demo_hud",
  "demo_hub",
  "mobile_bridge",
  "console_server",
  "native_host",
  "overlay_guard",
  "gui_approval",
  "image_store",
  "rich_help",
  "terminal_tui",
  "terminal_interaction",
  "resume_catalog",
  "skill_registry",
  "skill_runtime",
  "skill_context",
  "web_shim",
]

[tool.setuptools.package-data]
mobile = ["*.mjs", "*.json", "src/*.ts", "dist/*.js", "vendor/scrcpy-server-v*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
